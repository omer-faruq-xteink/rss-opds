# CI: runs the offline tests on every push/PR.
# Deploy: only when the repository variable AUTO_DEPLOY is "true" (Settings →
# Secrets and variables → Actions → Variables) and the secrets
# CLOUDFLARE_API_TOKEN (Workers Scripts: Edit) and CLOUDFLARE_ACCOUNT_ID exist.
# Worker secrets (COMMAFEED_API_KEY, OPDS_USER, OPDS_PASS, sanitizer tokens) are
# still set once with `wrangler secret put` or in the Cloudflare dashboard.
name: CI and deploy
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
  deploy:
    needs: test
    if: github.event_name != 'pull_request' && vars.AUTO_DEPLOY == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
